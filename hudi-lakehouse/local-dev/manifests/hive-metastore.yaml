# Hive Metastore for LOCAL DEVELOPMENT ONLY -- Derby-backed, single replica,
# fixed credentials. Real deployments point the hudi-trino chart at an
# existing HMS or AWS Glue instead.
#
# Uses the stock apache/hive image and the shared Docker bootstrap/config,
# installed as hive-metastore-bootstrap by up.sh. This validates any existing
# Derby database before reuse and supplies S3A settings to HMS itself.
# apache/hive:3.1.3 is amd64-only; ARM minikube requires working emulation.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hive-metastore-data
  namespace: hudi-lakehouse
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-metastore
  namespace: hudi-lakehouse
  labels:
    app.kubernetes.io/name: hive-metastore
    app.kubernetes.io/part-of: hudi-lakehouse
spec:
  replicas: 1
  # Derby allows a single process; never run old and new pods concurrently.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hive-metastore
  template:
    metadata:
      annotations:
        hudi.apache.org/bootstrap-checksum: "HMS_BOOTSTRAP_CHECKSUM"
        # Filled by the installer when loading a local image.
        hudi.apache.org/local-image-id: ""
      labels:
        app.kubernetes.io/name: hive-metastore
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: metastore
          image: apache/hive:3.1.3
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/lakehouse/start-metastore.sh"]
          env:
            - name: SERVICE_NAME
              value: metastore
          ports:
            - name: thrift
              containerPort: 9083
          volumeMounts:
            - name: conf
              mountPath: /opt/hive/conf/hive-site.xml
              subPath: hive-site.xml
            - name: conf
              mountPath: /lakehouse/start-metastore.sh
              subPath: start-metastore.sh
            - name: data
              mountPath: /opt/hive/data
          readinessProbe:
            tcpSocket:
              port: thrift
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
      volumes:
        - name: conf
          configMap:
            name: hive-metastore-bootstrap
        - name: data
          persistentVolumeClaim:
            claimName: hive-metastore-data
---
apiVersion: v1
kind: Service
metadata:
  name: hive-metastore
  namespace: hudi-lakehouse
  labels:
    app.kubernetes.io/name: hive-metastore
spec:
  ports:
    - name: thrift
      port: 9083
      targetPort: thrift
  selector:
    app.kubernetes.io/name: hive-metastore
