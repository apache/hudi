fullnameOverride: hudi-spark-connect
catalog:
  metastoreUri: thrift://hive-metastore.hudi-lakehouse.svc.cluster.local:9083
  warehouse: s3a://warehouse/connect
storage:
  s3:
    endpoint: http://minio.hudi-lakehouse.svc.cluster.local:9000
    pathStyleAccess: true
    existingSecret: spark-connect-s3
resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    memory: 3Gi
