nameOverride: ""
fullnameOverride: ""

image:
  repository: hudi-lakehouse-spark-connect
  tag: "4.1.3-hudi1.2.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []

# v1 runs one shared Spark driver with local worker threads in the same pod.
# This is NOT a Kubernetes executor deployment or a multi-tenant service.
spark:
  cores: 2
  driverMemory: 2g
  shufflePartitions: 2
  extraConf: {}

catalog:
  # Required for durable metadata; no embedded Derby catalog in the endpoint.
  metastoreUri: ""
  # Required, e.g. s3a://my-bucket/warehouse. Local pod storage is not durable.
  warehouse: ""

storage:
  s3:
    endpoint: ""
    region: us-east-1
    pathStyleAccess: false
    # Leave empty to use the SDK's default credential provider chain.
    # Never put credentials in Spark properties or the ConfigMap.
    existingSecret: ""
    accessKeyKey: accessKey
    secretKeyKey: secretKey
    # Optional key in existingSecret for temporary credentials.
    sessionTokenKey: ""

# No public ingress or unauthenticated LoadBalancer is provisioned.
service:
  port: 15002

resources:
  requests:
    cpu: "1"
    memory: 3Gi
  limits:
    memory: 4Gi

nodeSelector: {}
tolerations: []
affinity: {}
