nameOverride: ""
fullnameOverride: ""

image:
  repository: hudi-lakehouse-spark-connect
  tag: "4.1.3-hudi1.2.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []

# One shared driver. Empty master preserves local[cores]; cluster mode is opt-in.
# This is not a multi-tenant service.
spark:
  master: ""
  cores: 2
  driverMemory: 2g
  shufflePartitions: 2
  extraConf: {}

# Existing account with executor-management RBAC; required for a k8s:// master.
# This chart does not create cluster permissions.
serviceAccount:
  name: ""
  automountToken: false

# Server-side defaults, not enforced policy: session/table properties can override.
# Keep credentials in Secrets, never in this ConfigMap.
hudi:
  defaults: {}

catalog:
  # Required for durable metadata; no embedded Derby catalog in the endpoint.
  metastoreUri: ""
  # Required, e.g. s3a://my-bucket/warehouse. Local pod storage is not durable.
  warehouse: ""

storage:
  s3:
    endpoint: ""
    region: us-east-1
    pathStyleAccess: false
    # Leave empty to use the SDK's default credential provider chain.
    # Never put credentials in Spark properties or the ConfigMap.
    existingSecret: ""
    accessKeyKey: accessKey
    secretKeyKey: secretKey
    # Optional key in existingSecret for temporary credentials.
    sessionTokenKey: ""

# No public ingress or unauthenticated LoadBalancer is provisioned.
service:
  port: 15002

# Disk-backed /tmp on the driver; empty means no volume-specific limit.
# Use a Kubernetes quantity, e.g. "20Gi". This does not reserve node disk.
scratch:
  sizeLimit: ""

resources:
  requests:
    cpu: "1"
    memory: 3Gi
  limits:
    memory: 4Gi

nodeSelector: {}
tolerations: []
affinity: {}
