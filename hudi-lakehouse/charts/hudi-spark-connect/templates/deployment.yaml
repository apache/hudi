apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hudi-spark-connect.fullname" . }}
  labels:
    {{- include "hudi-spark-connect.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Sessions are in-memory; do not load-balance between independent drivers.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hudi-spark-connect.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hudi-spark-connect.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 185
        runAsGroup: 185
        fsGroup: 185
      containers:
        - name: spark-connect
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: connect
              containerPort: 15002
          env:
            - name: SPARK_LOCAL_DIRS
              value: /tmp/spark-local
            - name: AWS_REGION
              value: {{ .Values.storage.s3.region | quote }}
            {{- with .Values.storage.s3.existingSecret }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.storage.s3.accessKeyKey | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.storage.s3.secretKeyKey | quote }}
            {{- if $.Values.storage.s3.sessionTokenKey }}
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.storage.s3.sessionTokenKey | quote }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /opt/spark/conf/spark-defaults.conf
              subPath: spark-defaults.conf
              readOnly: true
            - name: scratch
              mountPath: /tmp
          # TCP probes check the listener, not catalog or write correctness.
          # The ADBC smoke test verifies the complete data path.
          startupProbe:
            tcpSocket:
              port: connect
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: connect
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "hudi-spark-connect.fullname" . }}-config
        - name: scratch
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
