{{- $uri := required "catalog.metastoreUri is required (use an external Hive Metastore)" .Values.catalog.metastoreUri -}}
{{- $warehouse := required "catalog.warehouse is required (use durable object storage)" .Values.catalog.warehouse -}}
{{- $conf := dict
  "spark.master" (include "hudi-spark-connect.master" .)
  "spark.driver.memory" .Values.spark.driverMemory
  "spark.connect.grpc.binding.address" "0.0.0.0"
  "spark.connect.grpc.binding.port" "15002"
  "spark.sql.catalogImplementation" "hive"
  "spark.hadoop.hive.metastore.uris" $uri
  "spark.sql.warehouse.dir" $warehouse
  "spark.sql.extensions" "org.apache.spark.sql.hudi.HoodieSparkSessionExtension"
  "spark.sql.catalog.spark_catalog" "org.apache.spark.sql.hudi.catalog.HoodieCatalog"
  "spark.serializer" "org.apache.spark.serializer.KryoSerializer"
  "spark.kryo.registrator" "org.apache.spark.HoodieSparkKryoRegistrar"
  "spark.sql.shuffle.partitions" .Values.spark.shufflePartitions
  "spark.hadoop.fs.s3a.impl" "org.apache.hadoop.fs.s3a.S3AFileSystem"
  "spark.hadoop.fs.s3a.endpoint.region" .Values.storage.s3.region
  "spark.hadoop.fs.s3a.path.style.access" .Values.storage.s3.pathStyleAccess
-}}
{{- with .Values.storage.s3.endpoint -}}
{{- $_ := set $conf "spark.hadoop.fs.s3a.endpoint" . -}}
{{- end -}}
{{- range $key, $value := .Values.spark.extraConf -}}
{{- if and (hasPrefix "k8s://" (include "hudi-spark-connect.master" $)) (has $key (list "spark.driver.host" "spark.kubernetes.driver.pod.name")) -}}
{{- fail (printf "%s is managed by the chart in Kubernetes mode" $key) -}}
{{- end -}}
{{- if hasKey $conf $key -}}
{{- fail (printf "%s is managed by the chart; use the corresponding value instead" $key) -}}
{{- end -}}
{{- if not (regexMatch "^spark\\.[A-Za-z0-9_.-]+$" $key) -}}
{{- fail (printf "invalid Spark property key: %s" $key) -}}
{{- end -}}
{{- $_ := set $conf $key $value -}}
{{- end -}}
{{- if hasPrefix "k8s://" (include "hudi-spark-connect.master" .) -}}
{{- if or (not .Values.serviceAccount.name) (not .Values.serviceAccount.automountToken) -}}
{{- fail "a k8s:// master requires serviceAccount.name and serviceAccount.automountToken=true" -}}
{{- end -}}
{{- $k8sDefaults := dict
  "spark.kubernetes.namespace" .Release.Namespace
  "spark.kubernetes.executor.container.image" (printf "%s:%s" .Values.image.repository .Values.image.tag)
  "spark.kubernetes.container.image.pullPolicy" .Values.image.pullPolicy
  "spark.driver.bindAddress" "0.0.0.0"
  "spark.executorEnv.AWS_REGION" .Values.storage.s3.region
-}}
{{- with .Values.imagePullSecrets -}}
{{- $names := list -}}
{{- range . -}}
{{- $names = append $names .name -}}
{{- end -}}
{{- $_ := set $k8sDefaults "spark.kubernetes.container.image.pullSecrets" (join "," $names) -}}
{{- end -}}
{{- with .Values.storage.s3.existingSecret -}}
{{- $_ := set $k8sDefaults "spark.kubernetes.executor.secretKeyRef.AWS_ACCESS_KEY_ID" (printf "%s:%s" . $.Values.storage.s3.accessKeyKey) -}}
{{- $_ := set $k8sDefaults "spark.kubernetes.executor.secretKeyRef.AWS_SECRET_ACCESS_KEY" (printf "%s:%s" . $.Values.storage.s3.secretKeyKey) -}}
{{- if $.Values.storage.s3.sessionTokenKey -}}
{{- $_ := set $k8sDefaults "spark.kubernetes.executor.secretKeyRef.AWS_SESSION_TOKEN" (printf "%s:%s" . $.Values.storage.s3.sessionTokenKey) -}}
{{- end -}}
{{- end -}}
{{- range $key, $value := $k8sDefaults -}}
{{- if not (hasKey $conf $key) -}}
{{- $_ := set $conf $key $value -}}
{{- end -}}
{{- end -}}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hudi-spark-connect.fullname" . }}-config
  labels:
    {{- include "hudi-spark-connect.labels" . | nindent 4 }}
data:
  spark-defaults.conf: |
    {{- range $key, $value := $conf }}
    {{ $key }} {{ include "hudi-spark-connect.propertyValue" $value }}
    {{- end }}
  hudi-defaults.conf: |
    {{- range $key, $value := .Values.hudi.defaults }}
    {{- if not (regexMatch "^hoodie\\.[A-Za-z0-9_.-]+$" $key) }}
    {{- fail (printf "invalid Hudi property key: %s" $key) }}
    {{- end }}
    {{ $key }}={{ include "hudi-spark-connect.hudiPropertyValue" $value }}
    {{- end }}
