[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hudi-spark-connect-superset"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["SQLAlchemy>=1.4,<2", "adbc-driver-manager==1.12.0", "pyarrow==18.1.0"]

[project.entry-points."sqlalchemy.dialects"]
sparkconnect = "hudi_spark_connect.dialect:SparkConnectDialect"

[project.entry-points."superset.db_engine_specs"]
sparkconnect = "hudi_spark_connect.engine_spec:SparkConnectEngineSpec"

[tool.setuptools]
packages = ["hudi_spark_connect"]
