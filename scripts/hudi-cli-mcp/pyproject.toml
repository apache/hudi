[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hudi_cli_mcp"]

[project]
name = "hudi-cli-mcp"
version = "0.1.0"
description = "MCP server exposing Apache Hudi CLI operations as tools for AI assistants."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["fastmcp>=2.0.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make `hudi_cli_mcp` importable without installing the package, regardless of
# the directory pytest is invoked from (resolved relative to this file).
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "B",   # bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["hudi_cli_mcp"]
