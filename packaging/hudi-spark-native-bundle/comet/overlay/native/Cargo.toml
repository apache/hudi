[workspace]
default-members = ["core", "spark-expr", "common", "proto", "jni-bridge", "shuffle"]
members = ["core", "spark-expr", "common", "proto", "jni-bridge", "shuffle"]
# Crates under ../contrib are intentionally NOT workspace members. Core pulls them in as
# optional path dependencies when their corresponding contrib feature is enabled.
exclude = ["../contrib"]
resolver = "2"

[workspace.package]
version = "1.1.0"
homepage = "https://datafusion.apache.org/comet"
repository = "https://github.com/apache/datafusion-comet"
authors = ["Apache DataFusion <dev@datafusion.apache.org>"]
description = "Apache DataFusion Comet: High performance accelerator for Apache Spark"
readme = "README.md"
license = "Apache-2.0"
edition = "2021"

# Comet uses the same minimum Rust version as DataFusion
rust-version = "1.94.0"

[workspace.dependencies]
arrow = { version = "59.2.0", features = ["prettyprint", "ffi", "chrono-tz"] }
arrow-data = { version = "59.2.0" }
arrow-select = { version = "59.2.0" }
async-trait = { version = "0.1" }
bytes = { version = "1.11.1" }
parquet = { version = "59.2.0", default-features = false, features = ["experimental"] }
datafusion = { version = "55.1.0", default-features = false, features = ["unicode_expressions", "crypto_expressions", "nested_expressions", "parquet"] }
datafusion-datasource = { version = "55.1.0" }
datafusion-physical-expr-adapter = { version = "55.1.0" }
datafusion-spark = { version = "55.1.0", features = ["core"] }
datafusion-comet-spark-expr = { path = "spark-expr" }
datafusion-comet-common = { path = "common" }
datafusion-comet-jni-bridge = { path = "jni-bridge" }
datafusion-comet-proto = { path = "proto" }
datafusion-comet-shuffle = { path = "shuffle" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3.32"
num = "0.4"
rand = "0.10"
# Before upgrading `regex`, complete the Java-parity fixture gate tracked in
# https://github.com/apache/datafusion-comet/issues/5813.
regex = "1.12.3"
thiserror = "2"
object_store = { version = "0.13.2", features = ["gcp", "azure", "aws", "http"] }
hudi = { git = "https://github.com/apache/hudi-rs.git", rev = "eb95599c29dc9859c62294335e51d302a59d10e7" }
# hudi-rs is on an older arrow major than this workspace. This renamed dep
# names hudi-rs's arrow so its batches can cross into this workspace's arrow
# through the Arrow C data interface (ABI-stable across majors). Drop it, and
# the export side of the crossing, once hudi-rs is on this workspace's major.
hudi-arrow = { package = "arrow", version = "58", default-features = false, features = ["ffi"] }
url = "2.2"
aws-config = "1.8.18"
aws-credential-types = "1.2.13"
# default-features off: the STS client is built from a fully-resolved SdkConfig, so it needs none
# of aws-sdk-sts's own transport/crypto defaults, and enabling them would pull extra crates.
aws-sdk-sts = { version = "1.114.0", default-features = false }
# Pinned to a revision rather than a release because no published iceberg-rust
# version is on our arrow: 0.10.1 requires arrow/parquet ^58. Move to a plain
# version requirement once a release ships on arrow 59. Bump policy: #5645.
iceberg = { git = "https://github.com/apache/iceberg-rust", rev = "bb1e4a4861f02377489eff818b75138f414c4cb0" }
iceberg-storage-opendal = { git = "https://github.com/apache/iceberg-rust", rev = "bb1e4a4861f02377489eff818b75138f414c4cb0", features = ["opendal-memory", "opendal-fs", "opendal-s3", "opendal-gcs", "opendal-oss", "opendal-azdls"] }
reqsign-core = "3"

[profile.release]
debug = true
overflow-checks = false
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# CI profile: faster compilation, same overflow behavior as release
# Use with: cargo build --profile ci
[profile.ci]
inherits = "release"
lto = false          # Skip LTO for faster linking
codegen-units = 16   # Parallel codegen (faster compile, slightly larger binary)
debug-assertions = true
panic = "unwind"     # Allow panics to be caught and logged across FFI boundary
# overflow-checks inherited as false from release
