# The executable paths intentionally validate a bounded scalar physical-schema surface. Complex,
# computed, metadata, and watermark columns remain unverified rather than being guessed.
[physical_types]
simple = [
  "BIGINT",
  "BOOLEAN",
  "BYTES",
  "DATE",
  "DOUBLE",
  "FLOAT",
  "INT",
  "INTEGER",
  "SMALLINT",
  "STRING",
  "TINYINT",
]
parameterized = [
  "BINARY",
  "CHAR",
  "DECIMAL",
  "TIME",
  "TIMESTAMP",
  "TIMESTAMP_LTZ",
  "VARBINARY",
  "VARCHAR",
]

[physical_schema_constraints]
binary_routing_types = ["BINARY", "BYTES", "VARBINARY"]
field_name_pattern = "^[A-Za-z_][A-Za-z0-9_]*$"
reserved_target_field_names = [
  "_hoodie_commit_seqno",
  "_hoodie_commit_time",
  "_hoodie_file_name",
  "_hoodie_operation",
  "_hoodie_partition_path",
  "_hoodie_record_key",
]
temporal_precision_min = 0
temporal_precision_max = 6
temporal_types = ["TIME", "TIMESTAMP", "TIMESTAMP_LTZ"]

[runtime_constraints]
checkpoint_interval_min_ms = 1000
flink_checkpoint_interval_min_ms = 10

