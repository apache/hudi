[[implemented_acceptance_checks]]
id = "FLINK_BINARY_ROUTING_FIELD_UNSUPPORTED"
requirement = "Reject binary record-key and partition fields whose Hudi 1.2.0 routing strings depend on Java object identity."
python_test = "test_pr2_rejects_binary_routing_fields"
java_test = "testPinnedBinaryValuesUseObjectIdentityForRouting"

[[implemented_acceptance_checks]]
id = "FLINK_RECORD_KEY_FIELD_MISSING"
requirement = "Reject an explicitly configured record-key field that is absent from the physical schema, including append mode."
python_test = "test_pr2_rejects_record_key_missing_from_append_schema"
java_test = "testPinnedFactorySkipsMissingRecordKeyCheckInAppendMode"

[[implemented_acceptance_checks]]
id = "FLINK_APPEND_MODE_CLUSTERING_ENABLED"
requirement = "Reject COW insert output whose effective write.insert.cluster value is not false."
python_test = "test_pr2_rejects_insert_clustering_override"
java_test = "testPinnedAppendModeRequiresInsertClusteringDisabled"

[[implemented_acceptance_checks]]
id = "FLINK_SOURCE_CHANGELOG_NOT_APPEND_ONLY"
requirement = "Validate generated INSERT INTO with a declared source schema and append-only changelog contract through a planner fixture."
python_test = "test_pr2_rejects_non_append_source_changelog"
java_test = "testStableKeySinkAndInsertPlan"

[[implemented_acceptance_checks]]
id = "FLINK_TEMPORAL_PRECISION_UNSUPPORTED"
requirement = "Reject TIME, TIMESTAMP, and TIMESTAMP_LTZ precision above the Hudi 1.2.0 connector limit of 6."
python_test = "test_pr2_enforces_pinned_temporal_precision_limits"
java_test = "testPinnedPlannerRejectsTemporalPrecisionAboveSix"

[[implemented_acceptance_checks]]
id = "FLINK_SCHEMA_FIELD_NAME_UNSUPPORTED"
requirement = "Reject physical field names that cannot be represented by the Avro-backed Hudi sink schema."
python_test = "test_pr2_rejects_non_avro_physical_field_names"
java_test = "testPinnedPlannerRejectsNonAvroFieldName"

[[implemented_acceptance_checks]]
id = "FLINK_HUDI_METADATA_FIELD_CONFLICT"
requirement = "Reject target physical field names reserved for Hudi metadata before the append writer prepends them."
python_test = "test_pr2_rejects_reserved_hudi_metadata_field_names"
java_test = "testPinnedWriterRejectsReservedHudiMetadataField"

[[implemented_acceptance_checks]]
id = "FLINK_CHECKPOINT_INTERVAL_UNSUPPORTED"
requirement = "Reject checkpoint intervals below the 1000 ms Architect safety floor while preserving the pinned Flink 10 ms runtime boundary as evidence."
python_test = "test_pr2_enforces_checkpoint_interval_safety_floor"
java_test = "testPinnedRuntimeCheckpointIntervalBoundary"

[[implemented_acceptance_checks]]
id = "FLINK_MUTABLE_SOURCE_CHANGELOG_UNSUPPORTED"
requirement = "Require a normalized UPSERT source and verify the Hudi sink consumes INSERT, UPDATE_AFTER, and DELETE without UPDATE_BEFORE."
python_test = "test_pr3_rejects_unsupported_source_changelog"
java_test = "testMutableCowSinkAndUpsertPlan"

[[implemented_acceptance_checks]]
id = "FLINK_MUTABLE_ORDERING_FIELD_INVALID"
requirement = "Require one non-null BIGINT or TIMESTAMP(p<=6) event-time ordering field and reject Hudi's no_precombine sentinel."
python_test = "test_pr3_rejects_invalid_ordering_fields"
java_test = "testPinnedMutableOrderingConfiguration"

[[implemented_acceptance_checks]]
id = "FLINK_MUTABLE_INDEX_CONFIGURATION_UNSUPPORTED"
requirement = "Pin global FLINK_STATE with no state expiry for replay-safe mutable routing."
python_test = "test_pr3_rejects_unsafe_index_configuration"
java_test = "testPinnedMutableIndexConfiguration"

[[implemented_acceptance_checks]]
id = "FLINK_MUTABLE_INDEX_BOOTSTRAP_REQUIRED"
requirement = "Require index bootstrap so a cold restart does not treat existing keys as new."
python_test = "test_pr3_requires_index_bootstrap"
java_test = "testPinnedMutableIndexBootstrapConfiguration"

[[implemented_acceptance_checks]]
id = "FLINK_MOR_CLUSTERING_UNSUPPORTED"
requirement = "Keep clustering disabled on the first mutable MOR path."
python_test = "test_pr4_rejects_clustering"
java_test = "testPinnedMorClusteringDisabled"

[[implemented_acceptance_checks]]
id = "FLINK_MOR_APPEND_ONLY_UNSUPPORTED"
requirement = "Keep append-only writes on COW because MOR insert enters append mode and does not schedule compaction."
python_test = "test_pr4_rejects_append_only_mor"
java_test = "testPinnedAppendOnlyMorDoesNotScheduleCompaction"

[[implemented_acceptance_checks]]
id = "FLINK_MOR_COMPACTION_CONFIGURATION_UNSUPPORTED"
requirement = "Pin scheduling and async compaction to the same Flink writer with a five-delta-commit trigger."
python_test = "test_pr4_rejects_incompatible_compaction_configuration"
java_test = "testPinnedMorCompactionConfiguration"

[[implemented_acceptance_checks]]
id = "FLINK_MOR_READ_OPTIMIZED_FRESHNESS_UNSUPPORTED"
requirement = "Record that read-optimized queries expose compacted base-file state rather than every delta commit."
python_test = "test_pr4_rejects_strict_read_optimized_freshness"
java_test = "testPinnedMorQuerySemantics"

[[implemented_acceptance_checks]]
id = "FLINK_PR4_WRITE_PATH_UNSUPPORTED"
requirement = "Plan the exact mutable MOR SQL through the released connector and retain its writer plus compaction operators."
python_test = "test_pr4_valid_mutable_mor_design_renders_exact_executable_sql"
java_test = "testMutableMorSinkAndCompactionPlan"

[[implemented_acceptance_checks]]
id = "FLINK_EXISTING_TABLE_PROPERTY_CONFLICT"
requirement = "Compare existing-table identity and durable properties using pinned table-version and partition-field semantics."
python_test = "test_pr5_property_and_schema_conflicts_are_blocked_and_preserved"
java_test = "testPinnedExistingTableTypeOverridesConflictingOption"

[[implemented_acceptance_checks]]
id = "FLINK_CATALOG_MODE_UNSUPPORTED"
requirement = "Reject catalog modes and compositions outside the five pinned PR6 profiles."
python_test = "test_pr6_rejects_unsupported_catalog_compositions"
java_test = "testPinnedCatalogFactoryRejectsUnknownMode"

[[implemented_acceptance_checks]]
id = "FLINK_CATALOG_PATH_CONFLICT"
requirement = "Require the DFS catalog-derived table path to exactly match the desired table path."
python_test = "test_pr6_rejects_dfs_catalog_path_mismatch"
java_test = "testPinnedDfsCatalogPathDerivation"

[[implemented_acceptance_checks]]
id = "FLINK_CATALOG_LIFECYCLE_UNRESOLVED"
requirement = "Limit the first HMS Catalog path to explicit external application-owned tables."
python_test = "test_pr6_hms_catalog_requires_external_table"
java_test = "testPinnedHmsCatalogExternalFlag"

[[implemented_acceptance_checks]]
id = "FLINK_MOR_CATALOG_NAMING_UNVERIFIED"
requirement = "Pin MOR Hive registrations to RO, RT, or ALL names derived from query modes."
python_test = "test_pr6_rejects_mor_catalog_naming_drift"
java_test = "testPinnedMorHiveSyncNamingDefaults"
