<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hudi AI Gateway</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <img class="logo" src="hudi-logo.png" alt="Apache Hudi" />
      <span>
        <strong>AI Gateway</strong>
        <small id="model-info">connecting&hellip;</small>
      </span>
      <select id="model-select" title="Model (within the configured provider)" hidden></select>
    </div>
    <button id="new-chat" title="Start a new conversation">New chat</button>
  </header>

  <main id="messages" aria-live="polite">
    <div class="welcome" id="welcome">
      <h1>Chat with your lakehouse</h1>
      <p>Ask questions about your Hudi tables in plain English. The agent
      inspects the catalog, writes guarded Trino SQL, and answers from real
      query results.</p>
      <div class="suggestions">
        <button class="suggestion">What tables are available?</button>
        <button class="suggestion">How many trips are there per city?</button>
        <button class="suggestion">Describe the trips table</button>
      </div>
    </div>
  </main>

  <footer>
    <form id="composer">
      <textarea id="input" rows="1" placeholder="Ask about your data&hellip;"
                autocomplete="off" autofocus></textarea>
      <button id="send" type="submit" title="Send">&#x27A4;</button>
    </form>
    <p class="fineprint">Answers are generated from live queries against your lakehouse. Verify before acting.</p>
  </footer>

  <script src="markdown.js"></script>
  <script src="app.js"></script>
</body>
</html>
