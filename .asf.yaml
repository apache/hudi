github:
  description: "Upserts, Deletes And Incremental Processing on Big Data."
  homepage: https://hudi.apache.org/
  labels:
    - hudi
    - apachehudi
    - datalake
    - incremental-processing
    - bigdata
    - stream-processing
    - data-integration
    - apachespark
    - apacheflink
  features:
    wiki: true
    issues: true
    projects: true
    discussions: true
  pull_requests:
    allow_auto_merge: true
  enabled_merge_buttons:
    squash:  true
    merge:   false
    rebase:  false
  protected_branches:
    master:
      required_pull_request_reviews:
        required_approving_review_count: 1
      required_status_checks:
        # The merge queue tests each PR against the latest master, so PRs need not be up to date.
        strict: false
        contexts:
          # Only contexts that report on every PR and every merge-queue group may be listed: a
          # context left without a run to report it blocks merges indefinitely (#18598).
          # The per-job test contexts are not listed. Each Java CI workflow ends with one aggregate
          # job over all of its jobs, so resharding a workflow never touches this file. There is
          # one aggregate per workflow, not one for both, because the ASF Actions policy caps the
          # jobs running at once per workflow at 20 (15 recommended).
          # validate-pr-and-source runs the PR metadata and source release checks in one job.
          - validate-pr-and-source
          - Java CI result
          - Java CI Engines result
  # Raw GitHub Rulesets API payload, as in apache/arrow-rs and apache/datafusion-comet.
  # Rulesets and classic branch protection apply together.
  rulesets:
    - name: Merge Queue
      target: branch
      enforcement: active
      bypass_actors:
        # apache/root (ASF Infra) can recover a blocked queue.
        - actor_id: 118420
          actor_type: Team
          bypass_mode: always
      conditions:
        ref_name:
          include:
            - "~DEFAULT_BRANCH"
          exclude: []
      rules:
        - type: merge_queue
          parameters:
            merge_method: SQUASH
            grouping_strategy: ALLGREEN
            # Two groups build at a time. A group invalidated mid-run still runs to the end,
            # because workflows cannot react to the merge_group destroyed event, so this caps
            # the waste per failed entry at one full Java CI run.
            max_entries_to_build: 2
            # Merges up to five already-green entries together; each PR keeps its own squash
            # commit, and CI builds are not batched.
            min_entries_to_merge: 1
            max_entries_to_merge: 5
            min_entries_to_merge_wait_minutes: 0
            # A full Java CI run plus ASF runner queueing.
            check_response_timeout_minutes: 300
  collaborators:
    - ad1happy2go
    - rangareddy
    - deepakpanda93
    - cshuo
    - HuangZhenQiu
    - linliu-code
    - vamsikarnika
    - rahil-c
    - lokeshj1703
    - hudi-bot
notifications:
  commits:      commits@hudi.apache.org
  issues:       commits@hudi.apache.org
  pullrequests: commits@hudi.apache.org
  discussions:  dev@hudi.apache.org
  jira_options: link label
