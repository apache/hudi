<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <style>
      .title { font-size: 24px; font-weight: bold; fill: #222; }
      .subtitle { font-size: 14px; fill: #555; }
      .section { font-size: 17px; font-weight: bold; fill: #222; }
      .repo { font-size: 17px; font-weight: bold; }
      .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; font-weight: bold; fill: #222; }
      .monosmall { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #222; }
      .desc { font-size: 12.5px; fill: #333; }
      .src { font-size: 11.5px; fill: #666; font-style: italic; }
      .head { font-size: 15px; font-weight: bold; fill: #222; }
      .step { font-size: 13px; fill: #222; }
      .stepnum { font-size: 13px; font-weight: bold; fill: #222; }
      .badge { font-size: 10.5px; font-weight: bold; }
      .note { font-size: 12.5px; fill: #333; }
      .boxlabel { font-size: 12.5px; font-weight: bold; }
    </style>
  </defs>

  <rect width="1280" height="960" fill="#ffffff"/>

  <text x="40" y="42" class="title">Running Hudi's Trino connector on a Trino server</text>
  <text x="40" y="66" class="subtitle">Where the shim and the connector live, and what changes in a Trino install until trinodb/trino#30682 is released.</text>

  <!-- Section A: where the code lives -->
  <text x="40" y="106" class="section">Where the code lives</text>

  <!-- trinodb/trino box -->
  <rect x="40" y="118" width="580" height="226" rx="8" fill="#f5f8fd" stroke="#4a78b5" stroke-width="1.5"/>
  <rect x="40" y="118" width="580" height="36" rx="8" fill="#dbe7f8" stroke="#4a78b5" stroke-width="1.5"/>
  <text x="56" y="142" class="repo" fill="#2d5a94">trinodb/trino</text>
  <text x="56" y="178" class="mono">plugin/trino-hudi/</text>
  <text x="56" y="196" class="desc">Trino's Hudi plugin, shipped in every Trino server as plugin/hudi/</text>

  <rect x="56" y="210" width="548" height="58" rx="6" fill="#e8f0fb" stroke="#4a78b5"/>
  <text x="68" y="230" class="boxlabel" fill="#2d5a94">Today</text>
  <text x="68" y="252" class="desc">trino-hudi-&lt;trino&gt;.jar holds the shim and Trino's own connector code together</text>
  <rect x="470" y="218" width="44" height="18" rx="9" fill="#f2c14e"/>
  <text x="492" y="231" class="badge" text-anchor="middle" fill="#3a2c00">SHIM</text>
  <rect x="520" y="218" width="78" height="18" rx="9" fill="#7d5bb5"/>
  <text x="559" y="231" class="badge" text-anchor="middle" fill="#ffffff">CONNECTOR</text>

  <rect x="56" y="276" width="548" height="58" rx="6" fill="#ffffff" stroke="#4a78b5" stroke-dasharray="5 4"/>
  <text x="68" y="296" class="boxlabel" fill="#2d5a94">After trinodb/trino#30682</text>
  <text x="68" y="318" class="desc">Only the shim stays; the connector comes from org.apache.hudi:hudi-trino</text>
  <rect x="554" y="284" width="44" height="18" rx="9" fill="#f2c14e"/>
  <text x="576" y="297" class="badge" text-anchor="middle" fill="#3a2c00">SHIM</text>

  <!-- apache/hudi box -->
  <rect x="660" y="118" width="580" height="226" rx="8" fill="#f4faf3" stroke="#3f8f3a" stroke-width="1.5"/>
  <rect x="660" y="118" width="580" height="36" rx="8" fill="#dcefd9" stroke="#3f8f3a" stroke-width="1.5"/>
  <text x="676" y="142" class="repo" fill="#2c6b28">apache/hudi</text>

  <text x="676" y="178" class="mono">hudi-trino/</text>
  <text x="676" y="196" class="desc">The connector code, published as org.apache.hudi:hudi-trino</text>
  <rect x="1146" y="166" width="78" height="18" rx="9" fill="#7d5bb5"/>
  <text x="1185" y="179" class="badge" text-anchor="middle" fill="#ffffff">CONNECTOR</text>

  <text x="676" y="226" class="mono">docker/trino/shim/</text>
  <text x="676" y="244" class="desc">Hudi's copy of the shim: HudiPlugin and its service descriptor</text>
  <rect x="1180" y="214" width="44" height="18" rx="9" fill="#f2c14e"/>
  <text x="1202" y="227" class="badge" text-anchor="middle" fill="#3a2c00">SHIM</text>

  <text x="676" y="274" class="mono">scripts/trino/build_plugin_zip.sh</text>
  <text x="676" y="292" class="desc">Builds connector + shim + every runtime jar for one Trino version into</text>
  <text x="676" y="314" class="monosmall">hudi-trino-plugin-&lt;hudi&gt;-trino-&lt;trino&gt;.zip</text>

  <!-- Section B: the plugin directory -->
  <text x="40" y="392" class="section">&lt;trino_install&gt;/plugin/hudi/ on the coordinator and every worker</text>

  <!-- column headers -->
  <rect x="40" y="406" width="470" height="36" rx="6" fill="#dbe7f8" stroke="#4a78b5"/>
  <text x="56" y="429" class="head">Stock Trino 484</text>
  <text x="494" y="429" class="src" text-anchor="end">as shipped in the Trino release</text>
  <rect x="530" y="406" width="220" height="36" rx="6" fill="#f3f3f3" stroke="#8a8a8a"/>
  <text x="640" y="429" class="head" text-anchor="middle">What to do</text>
  <rect x="770" y="406" width="470" height="36" rx="6" fill="#dcefd9" stroke="#3f8f3a"/>
  <text x="786" y="429" class="head">After the swap</text>
  <text x="1224" y="429" class="src" text-anchor="end">built by apache/hudi</text>

  <!-- left column rows (stock) -->
  <rect x="40" y="456" width="470" height="52" rx="6" fill="#e8f0fb" stroke="#4a78b5"/>
  <text x="52" y="476" class="mono">trino-hudi-484.jar</text>
  <text x="52" y="497" class="desc">Shim and Trino's connector in one jar</text>
  <rect x="362" y="464" width="44" height="18" rx="9" fill="#f2c14e"/>
  <text x="384" y="477" class="badge" text-anchor="middle" fill="#3a2c00">SHIM</text>
  <rect x="412" y="464" width="78" height="18" rx="9" fill="#7d5bb5"/>
  <text x="451" y="477" class="badge" text-anchor="middle" fill="#ffffff">CONNECTOR</text>

  <rect x="40" y="516" width="470" height="52" rx="6" fill="#e8f0fb" stroke="#4a78b5"/>
  <text x="52" y="536" class="mono">trino-hudi-484-services.jar</text>
  <text x="52" y="557" class="desc">Service descriptor that points Trino at HudiPlugin</text>

  <rect x="40" y="576" width="470" height="52" rx="6" fill="#e8f0fb" stroke="#4a78b5"/>
  <text x="52" y="596" class="mono">hudi-common-1.2.1.jar, hudi-io-1.2.1.jar</text>
  <text x="52" y="617" class="desc">Hudi libraries at the version Trino's connector was built with</text>

  <rect x="40" y="636" width="470" height="52" rx="6" fill="#e8f0fb" stroke="#4a78b5"/>
  <text x="52" y="656" class="mono">other runtime jars</text>
  <text x="52" y="677" class="desc">Trino 484 libraries and third-party jars</text>

  <rect x="32" y="448" width="486" height="248" rx="9" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="40" y="716" class="boxlabel" fill="#c0392b">Removed in step 2</text>

  <rect x="40" y="788" width="470" height="52" rx="6" fill="#f0f0f0" stroke="#8a8a8a"/>
  <text x="52" y="808" class="mono">hdfs/</text>
  <text x="52" y="829" class="desc">HDFS file system loader jars; ship only with the Trino server</text>

  <!-- middle column steps -->
  <rect x="530" y="456" width="220" height="84" rx="6" fill="#fafafa" stroke="#8a8a8a"/>
  <text x="542" y="476" class="stepnum">1. Stop Trino and back up</text>
  <text x="542" y="494" class="step">plugin/hudi outside plugin/:</text>
  <text x="542" y="512" class="step">Trino loads every directory</text>
  <text x="542" y="530" class="step">under plugin/.</text>

  <rect x="530" y="550" width="220" height="56" rx="6" fill="#fafafa" stroke="#8a8a8a"/>
  <text x="542" y="570" class="stepnum">2. Delete everything in</text>
  <text x="542" y="588" class="step">plugin/hudi except hdfs/.</text>

  <rect x="530" y="616" width="220" height="56" rx="6" fill="#fafafa" stroke="#8a8a8a"/>
  <text x="542" y="636" class="stepnum">3. Copy the jars from the</text>
  <text x="542" y="654" class="step">zip into plugin/hudi.</text>

  <rect x="530" y="682" width="220" height="56" rx="6" fill="#fafafa" stroke="#8a8a8a"/>
  <text x="542" y="702" class="stepnum">4. Start Trino on the</text>
  <text x="542" y="720" class="step">coordinator and every worker.</text>

  <!-- right column rows (after) -->
  <rect x="770" y="456" width="470" height="52" rx="6" fill="#e6f4e4" stroke="#3f8f3a"/>
  <text x="782" y="476" class="mono">trino-hudi-484.jar</text>
  <text x="782" y="497" class="desc">Shim only: HudiPlugin</text>
  <text x="944" y="497" class="src">from docker/trino/shim/</text>
  <rect x="1176" y="464" width="44" height="18" rx="9" fill="#f2c14e"/>
  <text x="1198" y="477" class="badge" text-anchor="middle" fill="#3a2c00">SHIM</text>

  <rect x="770" y="516" width="470" height="52" rx="6" fill="#e6f4e4" stroke="#3f8f3a"/>
  <text x="782" y="536" class="mono">trino-hudi-484-services.jar</text>
  <text x="782" y="557" class="desc">Service descriptor that points Trino at HudiPlugin</text>

  <rect x="770" y="576" width="470" height="52" rx="6" fill="#e6f4e4" stroke="#3f8f3a"/>
  <text x="782" y="596" class="mono">org.apache.hudi_hudi-trino-&lt;hudi&gt;.jar</text>
  <text x="782" y="617" class="desc">Hudi's connector</text>
  <text x="890" y="617" class="src">from hudi-trino/</text>
  <rect x="1142" y="584" width="78" height="18" rx="9" fill="#7d5bb5"/>
  <text x="1181" y="597" class="badge" text-anchor="middle" fill="#ffffff">CONNECTOR</text>

  <rect x="770" y="636" width="470" height="52" rx="6" fill="#e6f4e4" stroke="#3f8f3a"/>
  <text x="782" y="656" class="mono">hudi-common, hudi-io, ... at &lt;hudi&gt;</text>
  <text x="782" y="677" class="desc">Hudi libraries at the connector's version</text>

  <rect x="770" y="696" width="470" height="52" rx="6" fill="#e6f4e4" stroke="#3f8f3a"/>
  <text x="782" y="716" class="mono">other runtime jars</text>
  <text x="782" y="737" class="desc">Trino 484 libraries and third-party jars, built for Trino 484</text>

  <rect x="762" y="448" width="486" height="308" rx="9" fill="none" stroke="#3f8f3a" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="770" y="776" class="boxlabel" fill="#2c6b28">Copied in from hudi-trino-plugin-&lt;hudi&gt;-trino-484.zip in step 3</text>

  <rect x="770" y="788" width="470" height="52" rx="6" fill="#f0f0f0" stroke="#8a8a8a"/>
  <text x="782" y="808" class="mono">hdfs/</text>
  <text x="782" y="829" class="desc">Kept from stock Trino, unchanged</text>

  <line x1="512" y1="814" x2="766" y2="814" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="640" y="806" class="note" text-anchor="middle">kept as is</text>

  <!-- legend -->
  <rect x="40" y="872" width="18" height="18" rx="3" fill="#e8f0fb" stroke="#4a78b5"/>
  <text x="66" y="886" class="note">From stock Trino</text>
  <rect x="200" y="872" width="18" height="18" rx="3" fill="#e6f4e4" stroke="#3f8f3a"/>
  <text x="226" y="886" class="note">From the Hudi zip</text>
  <rect x="360" y="872" width="18" height="18" rx="3" fill="#f0f0f0" stroke="#8a8a8a"/>
  <text x="386" y="886" class="note">Kept from stock Trino</text>
  <rect x="560" y="872" width="44" height="18" rx="9" fill="#f2c14e"/>
  <text x="582" y="885" class="badge" text-anchor="middle" fill="#3a2c00">SHIM</text>
  <text x="612" y="886" class="note">HudiPlugin, the entry point Trino loads</text>
  <rect x="880" y="872" width="78" height="18" rx="9" fill="#7d5bb5"/>
  <text x="919" y="885" class="badge" text-anchor="middle" fill="#ffffff">CONNECTOR</text>
  <text x="966" y="886" class="note">The code that reads Hudi tables</text>

  <text x="40" y="924" class="note">The zip only works on the Trino version it was built for: build it with --trino-version set to your server's version.</text>
</svg>
