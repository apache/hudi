  # One stable check name per workflow for branch protection and the merge queue. A skipped job
  # reports success to a required check, so this check fails on a skipped job just as it does on a
  # failed or cancelled one. Each workflow has its own check rather than one for both, because the
  # ASF GitHub Actions policy caps the jobs running at once in one workflow at 20 (15 recommended),
  # and a single run of both workflows would exceed it. Adding or resharding a job means adding its
  # id to `needs` below and `if: *route` to the job, and nothing else. The one exception to the
  # skipped-job rule is FORK_PR, where every test job skips on purpose and the merge queue runs
  # them before merge. UPSTREAM_OTHER_PUSH skips this job too, since nothing ran that it could
  # aggregate.
  java-ci-engines-result:
    name: Java CI Engines result
    runs-on: ubuntu-slim
    if: ${{ always() && !(github.event_name == 'push' && github.repository == 'apache/hudi' && github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/heads/release-') && github.ref != 'refs/heads/branch-0.x') }}
    permissions: {}
    needs:
      - test-flink-1
      - test-flink-2
      - validate-bundles
      - validate-bundle-spark4
      - integration-tests
    env:
      FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && github.base_ref == 'master' }}
    steps:
      - name: Summarize job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS"
      # The upstream run of a fork PR tests nothing, so point the contributor at the fork run.
      - name: Link to fork CI
        if: env.FORK_PR == 'true'
        env:
          FORK_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            printf 'Full test results: [Java CI Engines on %s](https://github.com/%s/actions/workflows/java_ci_engines.yml).\n\n' "$FORK_REPOSITORY" "$FORK_REPOSITORY"
            printf 'Look for commit `%s`. Enable Actions in your fork and push your branch if no run exists.\n\n' "$PR_HEAD_SHA"
            printf 'This upstream PR run skips the Java CI Engines test jobs. The merge queue runs them on ASF runners before merge.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail unless every job succeeded
        if: >-
          ${{ env.FORK_PR == 'true' && (contains(needs.*.result, 'success') || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
          || env.FORK_PR != 'true' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')) }}
        env:
          REQUIREMENT: ${{ env.FORK_PR == 'true' && 'Every job in Java CI Engines must be skipped on a fork PR to master.' || 'Every job in Java CI Engines must succeed.' }}
        run: |
          echo "::error::$REQUIREMENT The summary step above lists each result."
          exit 1
