name: Java CI Engines

# This filter replaces the former `changes` job. That job listed the changed files and every test
# job waited on it through `needs`, which made each run wait for a shared runner twice: once for
# the filter, once for the tests. GitHub evaluates `paths` before creating any job, so the same
# decision now costs nothing. The filter applies to push only: pull_request and merge_group runs
# must always report the aggregate check at the end of this file, and a required check whose
# workflow the filter skipped never reports, so it would stay pending forever. A docs-only PR
# therefore runs the full suite; a fork PR to master runs it in the merge queue.
# yml/yaml files are deliberately NOT ignored, unlike the old filter: docker/compose/*.yml drives
# the integration tests, several modules keep yml test resources, and the workflow files themselves
# need CI to run when they change.
#
# Push covers every branch because forks run the full suite on their own runners for each branch
# push; see "Pull requests from forks" in README.md. Upstream pushes to branches other than master,
# release-* and branch-0.x skip every job: their PRs test them. Merge-queue branches
# (gh-readonly-queue/...) are validated by merge_group, not push: a skipped aggregate job on a
# queue-branch push would report success and could satisfy the gate early.
on:
  push:
    branches-ignore:
      - asf-site
      - 'gh-readonly-queue/**'
    paths:
      - '**'
      # Listed explicitly so the filter does not depend on '**' matching dot-prefixed paths.
      - '.github/**'
      - '!**.bmp'
      - '!**.gif'
      - '!**.jpg'
      - '!**.jpeg'
      - '!**.md'
      - '!**.pdf'
      - '!**.png'
      - '!**.svg'
      - '!.gitignore'
  pull_request:
    branches:
      - master
      - 'release-*'
      - branch-0.x
  merge_group:
    types: [checks_requested]

# A group holds one running and one pending run, and a newer pending run replaces the older one
# even when cancel-in-progress is false. Pushes to apache/hudi are therefore keyed by SHA, so a
# burst of queue merges to master never replaces a pending master run. Pushes on a fork are keyed
# by branch and cancel in progress, so a new push to a PR branch replaces the run of the older
# head instead of spending fork runner time on it. merge_group refs are unique per queue entry
# and merge_group runs never cancel in progress, so queue runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.repository == 'apache/hudi' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.repository != 'apache/hudi') }}

env:
  # The retry/timeout knobs below are maven-resolver (aether.*) properties. Maven 3.9 resolves
  # artifacts through the native resolver HTTP transport, which ignores the older maven.wagon.* names.
  # serviceUnavailable lists the HTTP codes retried instead of failing the build. 403 is deliberately
  # absent: Maven Central answers 403 when its CDN has blocked the runner's egress IP, and retrying
  # that is what escalates the block.
  # Keep MVN_ARGS in sync with bot.yml.
  MVN_ARGS: -e -ntp -B -V -Dgpg.skip -Djacoco.skip -Pwarn-log -Dorg.slf4j.simpleLogger.log.org.apache.maven.plugins.shade=warn -Dorg.slf4j.simpleLogger.log.org.apache.maven.plugins.dependency=warn -Daether.connector.http.retryHandler.count=5 -Daether.connector.http.retryHandler.interval=3000 -Daether.connector.http.retryHandler.intervalMax=30000 -Daether.connector.http.retryHandler.serviceUnavailable=429,500,502,503,504 -Daether.connector.http.connectionMaxTtl=25 -Dorg.eclipse.jetty.LEVEL=WARN
  FLINK_IT_FILTER1: -Dit.test=ITTestHoodieDataSource
  FLINK_IT_FILTER2: -Dit.test=!ITTestHoodieDataSource

# Two conditions route the jobs. GitHub expressions cannot be named, so the first test job spells
# them out in full under the YAML anchor `route`, every other test job reuses it through the alias
# `*route`, and the aggregate job at the end spells out the parts it needs.
#
# FORK_PR, a pull request from a fork to master:
#   github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && github.base_ref == 'master'
# Its test jobs already run on the fork's runners when the contributor pushes the branch, and
# fork_ci_status.yml mirrors that run, together with the fork's bot.yml run, onto the PR as the
# informational `CI (fork)` check. The merge queue then runs them on ASF runners against the
# proposed merge with master. The event_name guard matters: on merge_group the pull_request fields
# are empty strings, and an empty head repository differs from github.repository. Fork PRs to
# release-* and branch-0.x keep upstream testing, since only master merges through the queue.
#
# UPSTREAM_OTHER_PUSH, a push to apache/hudi other than to master, release-* or branch-0.x:
#   github.event_name == 'push' && github.repository == 'apache/hudi' && github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/heads/release-') && github.ref != 'refs/heads/branch-0.x'
# Such branches back same-repository PRs, which test them through pull_request.
jobs:
  test-flink-1:
    if: &route ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && github.base_ref == 'master') && !(github.event_name == 'push' && github.repository == 'apache/hudi' && github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/heads/release-') && github.ref != 'refs/heads/branch-0.x') }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          # [CI-TRIM] to revisit for CI improvement
#          - flinkProfile: "flink1.18"
#            flinkAvroVersion: "1.11.4"
#            flinkParquetVersion: '1.13.1'
#          - flinkProfile: "flink1.19"
#            flinkAvroVersion: "1.11.4"
#            flinkParquetVersion: '1.13.1'
#          - flinkProfile: "flink1.20"
#            flinkAvroVersion: "1.11.4"
#            flinkParquetVersion: '1.13.1'
#          - flinkProfile: "flink2.0"
#            flinkAvroVersion: "1.11.4"
#            flinkParquetVersion: '1.14.4'
          - flinkProfile: "flink2.2"
            flinkAvroVersion: "1.11.4"
            flinkParquetVersion: '1.15.2'
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          architecture: x64
          cache: maven
      - name: Build Project
        env:
          SCALA_PROFILE: 'scala-2.12'
          FLINK_PROFILE: ${{ matrix.flinkProfile }}
          FLINK_AVRO_VERSION: ${{ matrix.flinkAvroVersion }}
          FLINK_PARQUET_VERSION: ${{ matrix.flinkParquetVersion }}
        run:
          mvn clean install -T 2 -D"$SCALA_PROFILE" -D"$FLINK_PROFILE" -pl hudi-examples/hudi-examples-flink -am -Davro.version="$FLINK_AVRO_VERSION" -Dparquet.version="$FLINK_PARQUET_VERSION" -DskipTests=true $MVN_ARGS
      - name: Quickstart Test
        env:
          SCALA_PROFILE: 'scala-2.12'
          FLINK_PROFILE: ${{ matrix.flinkProfile }}
          FLINK_AVRO_VERSION: ${{ matrix.flinkAvroVersion }}
          FLINK_PARQUET_VERSION: ${{ matrix.flinkParquetVersion }}
        run:
          mvn test -Punit-tests -D"$SCALA_PROFILE" -D"$FLINK_PROFILE" -Davro.version="$FLINK_AVRO_VERSION" -Dparquet.version="$FLINK_PARQUET_VERSION" -pl hudi-examples/hudi-examples-flink $MVN_ARGS
      - name: Integration Test 1
        env:
          SCALA_PROFILE: 'scala-2.12'
          FLINK_PROFILE: ${{ matrix.flinkProfile }}
          FLINK_AVRO_VERSION: ${{ matrix.flinkAvroVersion }}
          FLINK_PARQUET_VERSION: ${{ matrix.flinkParquetVersion }}
        if: ${{ endsWith(env.FLINK_PROFILE, '2.2') }}
        run: |
          mvn clean install -T 2 -Pintegration-tests -D"$SCALA_PROFILE" -D"$FLINK_PROFILE" -pl hudi-flink-datasource/hudi-flink -am -Davro.version="$FLINK_AVRO_VERSION" -Dparquet.version="$FLINK_PARQUET_VERSION" -DskipTests=true $MVN_ARGS
          mvn verify -Pintegration-tests -D"$SCALA_PROFILE" -D"$FLINK_PROFILE" -Davro.version="$FLINK_AVRO_VERSION" -Dparquet.version="$FLINK_PARQUET_VERSION" $FLINK_IT_FILTER1 -pl hudi-flink-datasource/hudi-flink $MVN_ARGS -Djacoco.skip=false
      # No coverage on merge-queue runs. Codecov files an upload from a gh-readonly-queue ref under
      # master, for a commit that may never land, and a group that succeeds would upload the same
      # commit twice: once from the queue run, once from the master push run.
      - name: Generate merged coverage report
        if: always() && endsWith(matrix.flinkProfile, '2.2') && github.event_name != 'merge_group'
        run: ./scripts/jacoco/generate_merged_coverage_report.sh $GITHUB_WORKSPACE
      - name: Upload coverage to Codecov
        if: always() && endsWith(matrix.flinkProfile, '2.2') && github.event_name != 'merge_group'
        uses: ./.github/actions/upload-coverage
        with:
          flags: flink-integration-tests
          token: ${{ secrets.CODECOV_TOKEN }}

  test-flink-2:
    if: *route
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - flinkProfile: "flink2.2"
            flinkAvroVersion: "1.11.4"
