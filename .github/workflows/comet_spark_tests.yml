          echo "HUDI_CONF_DIR=$RUNNER_TEMP/hudi-conf" >> "$GITHUB_ENV"
      - name: Build Project
        run:
          mvn clean install -T 2 -Pjava17 -D"$SCALA_PROFILE" -D"$SPARK_PROFILE" -D"$FLINK_PROFILE" -DskipTests=true -Phudi-platform-service -Pthrift-gen-source $MVN_ARGS $COMET_ARGS -am -pl hudi-utilities
      - name: UT - hudi-utilities (TestHoodie*)
        run:
          mvn test -Punit-tests -Pjava17 -D"$SCALA_PROFILE" -D"$SPARK_PROFILE" -D"$FLINK_PROFILE" -fae -Dtest="TestHoodie*" -Dsurefire.failIfNoSpecifiedTests=false -pl hudi-utilities $MVN_ARGS $COMET_ARGS
      - name: UT - hudi-utilities (others)
        if: always()
        run:
          mvn test -Punit-tests -Pjava17 -D"$SCALA_PROFILE" -D"$SPARK_PROFILE" -D"$FLINK_PROFILE" -fae -Dtest='!TestHoodie*' -Dsurefire.failIfNoSpecifiedTests=false -pl hudi-utilities $MVN_ARGS $COMET_ARGS
      - name: FT - hudi-utilities
        if: always()
        run:
          mvn test -Pfunctional-tests -Pjava17 -D"$SCALA_PROFILE" -D"$SPARK_PROFILE" -D"$FLINK_PROFILE" -fae -Dsurefire.failIfNoSpecifiedTests=false -pl hudi-utilities $MVN_ARGS $COMET_ARGS
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-utilities
          path: '**/target/surefire-reports/**'
          retention-days: 7

  test-spark-java-tests-part1:
