name: CI

# The `paths` filter below applies to push only. pull_request and merge_group runs must always
# report the `Required Checks` aggregate: GitHub evaluates `paths` before creating any job, so a
# workflow skipped by the filter never reports its checks, and a required check that never reports
# stays pending forever. A docs-only PR therefore runs the full suite. The filter replaced a former
# `changes` job that listed the changed files; every test job waited on it through `needs`, which
# made each run wait for a shared runner twice, once for the filter and once for the tests.
# yml/yaml files are deliberately NOT ignored, unlike the old filter: docker/compose/*.yml drives
# the integration tests, several modules keep yml test resources, and the workflow files themselves
# need CI to run when they change.
on:
  pull_request:
    branches:
      - master
      - 'release-*'
      - branch-0.x
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - master
      - 'release-*'
      - branch-0.x
    paths:
      - '**'
      # Listed explicitly so the filter does not depend on '**' matching dot-prefixed paths.
      - '.github/**'
      - '!**.bmp'
      - '!**.gif'
      - '!**.jpg'
      - '!**.jpeg'
      - '!**.md'
      - '!**.pdf'
      - '!**.png'
      - '!**.svg'
      - '!.gitignore'
  workflow_dispatch:

# A group holds one running and one pending run, and a newer pending run replaces the older one
# even when cancel-in-progress is false. Pushes are therefore keyed by SHA, so a burst of queue
# merges to master never replaces a pending master run. merge_group refs are unique per queue
# entry and only pull_request runs cancel in progress, so queue runs are never cancelled.
# event_name keeps workflow_dispatch and push runs apart. The called workflows declare no
# concurrency of their own: github.workflow there resolves to this caller's name, so both would
# share one group and cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  java-ci:
    name: Java CI
    uses: ./.github/workflows/bot.yml
    secrets: inherit

  java-ci-engines:
    name: Java CI Engines
    uses: ./.github/workflows/java_ci_engines.yml
    secrets: inherit

  # One stable check name for branch protection and the merge queue. It needs the two `uses:` jobs
  # rather than the jobs inside them, so resharding or renaming a job in bot.yml or
  # java_ci_engines.yml never changes what is required. A skipped job reports success to a required
  # check, so a skipped workflow fails here just like a failed or cancelled one.
  required-checks:
    name: Required Checks
    runs-on: ubuntu-slim
    if: always()
    permissions: {}
    needs:
      - java-ci
      - java-ci-engines
    steps:
      - name: Summarize workflow results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS"
      - name: Fail unless both workflows succeeded
        if: needs.java-ci.result != 'success' || needs.java-ci-engines.result != 'success'
        env:
          JAVA_CI_RESULT: ${{ needs.java-ci.result }}
          JAVA_CI_ENGINES_RESULT: ${{ needs.java-ci-engines.result }}
        run: |
          echo "::error::Java CI: $JAVA_CI_RESULT, Java CI Engines: $JAVA_CI_ENGINES_RESULT. Both must succeed."
          exit 1
