  test-hudi-hadoop-mr-and-hudi-java-client:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - scalaProfile: "scala-2.12"
            sparkProfile: "spark3.5"
            flinkProfile: "flink2.2"

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          architecture: x64
          cache: maven
      - name: Build Project
        env:
          SCALA_PROFILE: ${{ matrix.scalaProfile }}
          SPARK_PROFILE: ${{ matrix.sparkProfile }}
          FLINK_PROFILE: ${{ matrix.flinkProfile }}
        run:
          mvn clean install -T 2 -D"$SCALA_PROFILE" -D"$SPARK_PROFILE" -D"$FLINK_PROFILE" -DskipTests=true -Phudi-platform-service $MVN_ARGS -am -pl hudi-hadoop-mr,hudi-client/hudi-java-client
      - name: UT - hudi-hadoop-mr and hudi-client/hudi-java-client
        env:
          SCALA_PROFILE: ${{ matrix.scalaProfile }}
          SPARK_PROFILE: ${{ matrix.sparkProfile }}
          FLINK_PROFILE: ${{ matrix.flinkProfile }}
        run:
          mvn test -Punit-tests -fae -D"$SCALA_PROFILE" -D"$SPARK_PROFILE" -D"$FLINK_PROFILE" -pl hudi-hadoop-mr,hudi-client/hudi-java-client $MVN_ARGS -Djacoco.skip=false
      - name: Test timing summary
        if: always()
        run: python3 scripts/ci/test_timing_summary.py --title "${{ github.job }}"
      - name: Generate merged coverage report
        if: always()
        run: ./scripts/jacoco/generate_merged_coverage_report.sh $GITHUB_WORKSPACE
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          files: ./jacoco-report.xml
          disable_search: true
          flags: hadoop-mr-java-client
          token: ${{ secrets.CODECOV_TOKEN }}

  # How the Spark JDK 17 jobs below are sharded. The minutes come from master run
  # 34314808833 on 2026-09-09, before the two-fork surefire change earlier on this branch,
  # so treat them as relative weights rather than the wall time a job takes today.
  #   Java UT splits by package: the org.apache.hudi.functional package (31.9 min) runs in
  #   test-spark-java17-ut-functional and everything outside it (35.3 min) in
  #   test-spark-java17-ut-other. The three fat classes TestCOWDataSource, TestMORDataSource
  #   and TestHoodieFileSystemViews (17 min) are pulled out of both and share a job with
  #   Java FTC (12 min), which is too small to stand alone.
  #   Java FTA (35 min) and Java FTB (29 min) are each their own job.
  #   Scala splits by package: dml.others (29.6 min) | dml.insert + dml.schema (17.3 min) |
  #   procedure + ddl (25.5 min) | the rest of SCALA_TEST_OTHERS_FILTER (~25 min).
  # Re-measure before the next rebalance instead of moving packages on guesswork: these
  # numbers are one run of one branch and they drift as suites are added.
  test-spark-java17-ut-functional:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # [CI-TRIM] to revisit for CI improvement
#          - scalaProfile: "scala-2.13"
#            sparkProfile: "spark3.5"
#            sparkModules: "hudi-spark-datasource/hudi-spark3.5.x"
#          - scalaProfile: "scala-2.13"
#            sparkProfile: "spark4.0"
#            sparkModules: "hudi-spark-datasource/hudi-spark4.0.x"
#          - scalaProfile: "scala-2.13"
#            sparkProfile: "spark4.1"
#            sparkModules: "hudi-spark-datasource/hudi-spark4.1.x"
          # hudi-spark4-common runs in the two java UT jobs (ut-functional and ut-other) and
          # nowhere else: the other spark lanes either pin a fixed test-class list or run
          # scala/functional profiles, so without this entry the module's java unit tests are
          # compiled but never executed in CI.
          - scalaProfile: "scala-2.13"
            sparkProfile: "spark4.2"
            sparkModules: "hudi-spark-datasource/hudi-spark4-common,hudi-spark-datasource/hudi-spark4.2.x"

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          architecture: x64
          cache: maven
      - name: Build Project
        env:
          SCALA_PROFILE: ${{ matrix.scalaProfile }}
          SPARK_PROFILE: ${{ matrix.sparkProfile }}
          SPARK_MODULES: ${{ matrix.sparkModules }}
        run:
          mvn clean install -T 2 -Pjava17 -D"$SCALA_PROFILE" -D"$SPARK_PROFILE" -DskipTests=true $MVN_ARGS -am -pl "hudi-common,$SPARK_COMMON_MODULES,$SPARK_MODULES"
      - name: Java UT - functional package
        env:
          SCALA_PROFILE: ${{ matrix.scalaProfile }}
          SPARK_PROFILE: ${{ matrix.sparkProfile }}
          SPARK_MODULES: ${{ matrix.sparkModules }}
        run:
          mvn test -Punit-tests -Pjava17 -D"$SCALA_PROFILE" -D"$SPARK_PROFILE" -DwildcardSuites=skipScalaTests "$JAVA_UT_FUNCTIONAL_FILTER" -Dsurefire.failIfNoSpecifiedTests=false -pl "hudi-common,$SPARK_COMMON_MODULES,$SPARK_MODULES" $MVN_ARGS -Djacoco.skip=false
      - name: Test timing summary
        if: always()
        run: python3 scripts/ci/test_timing_summary.py --title "${{ github.job }}"
      - name: Generate merged coverage report
        if: always()
        run: ./scripts/jacoco/generate_merged_coverage_report.sh $GITHUB_WORKSPACE
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          files: ./jacoco-report.xml
          disable_search: true
          flags: spark-java-tests
          token: ${{ secrets.CODECOV_TOKEN }}

