name: Java CI

# This filter replaces the former `changes` job. That job listed the changed files and every test
# job waited on it through `needs`, which made each run wait for a shared runner twice: once for
# the filter, once for the tests. GitHub evaluates `paths` before creating any job, so the same
# decision now costs nothing. A docs-only change creates no run of this workflow at all, which is
# fine because no required status check lives here (see validate_source.yml).
# yml/yaml files are deliberately NOT ignored, unlike the old filter: docker/compose/*.yml drives
# the integration tests, several modules keep yml test resources, and the workflow files themselves
# need CI to run when they change.
on:
  push:
    branches:
      - master
      - 'release-*'
      - branch-0.x
    paths:
      - '**'
      # Listed explicitly so the filter does not depend on '**' matching dot-prefixed paths.
      - '.github/**'
      - '!**.bmp'
      - '!**.gif'
      - '!**.jpg'
      - '!**.jpeg'
      - '!**.md'
      - '!**.pdf'
      - '!**.png'
      - '!**.svg'
      - '!.gitignore'
  pull_request:
    branches:
      - master
      - 'release-*'
      - branch-0.x
    paths:
      - '**'
      # Listed explicitly so the filter does not depend on '**' matching dot-prefixed paths.
      - '.github/**'
      - '!**.bmp'
      - '!**.gif'
      - '!**.jpg'
      - '!**.jpeg'
      - '!**.md'
      - '!**.pdf'
      - '!**.png'
      - '!**.svg'
      - '!.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'master') && !contains(github.ref, 'branch-0.x') && !contains(github.ref, 'release-') }}

env:
  # The retry/timeout knobs below are maven-resolver (aether.*) properties. Maven 3.9 resolves
  # artifacts through the native resolver HTTP transport, which ignores the older maven.wagon.* names.
  # serviceUnavailable lists the HTTP codes retried instead of failing the build. 403 is deliberately
  # absent: Maven Central answers 403 when its CDN has blocked the runner's egress IP, and retrying
  # that is what escalates the block.
  # Keep MVN_ARGS in sync with java_ci_engines.yml.
  MVN_ARGS: -e -ntp -B -V -Dgpg.skip -Djacoco.skip -Pwarn-log -Dorg.slf4j.simpleLogger.log.org.apache.maven.plugins.shade=warn -Dorg.slf4j.simpleLogger.log.org.apache.maven.plugins.dependency=warn -Daether.connector.http.retryHandler.count=5 -Daether.connector.http.retryHandler.interval=3000 -Daether.connector.http.retryHandler.intervalMax=30000 -Daether.connector.http.retryHandler.serviceUnavailable=429,500,502,503,504 -Daether.connector.http.connectionMaxTtl=25 -Dorg.eclipse.jetty.LEVEL=WARN
  SPARK_COMMON_MODULES: hudi-spark-datasource/hudi-spark,hudi-spark-datasource/hudi-spark-common
  JAVA_UT_FILTER1: -Dtest=!TestCOWDataSource,!TestMORDataSource,!TestHoodieFileSystemViews
  JAVA_UT_FILTER2: -Dtest=TestCOWDataSource,TestMORDataSource,TestHoodieFileSystemViews
  JAVA_UT_FUNCTIONAL_FILTER: -Dtest=**/org/apache/hudi/functional/**/*,!TestCOWDataSource,!TestMORDataSource,!TestHoodieFileSystemViews
  JAVA_UT_NON_FUNCTIONAL_FILTER: -Dtest=!**/org/apache/hudi/functional/**/*
  SCALA_TEST_DML_FILTER: -DwildcardSuites=org.apache.spark.sql.hudi.dml
  SCALA_TEST_DML1_FILTER: -DwildcardSuites=org.apache.spark.sql.hudi.dml.others
  SCALA_TEST_DML2_FILTER: -DwildcardSuites=org.apache.spark.sql.hudi.dml.insert,org.apache.spark.sql.hudi.dml.schema
  SCALA_TEST_OTHERS_FILTER: -DwildcardSuites=org.apache.hudi,org.apache.spark.hudi,org.apache.spark.sql.avro,org.apache.spark.sql.execution,org.apache.spark.sql.hive,org.apache.spark.sql.hudi.analysis,org.apache.spark.sql.hudi.blob,org.apache.spark.sql.hudi.catalog,org.apache.spark.sql.hudi.command,org.apache.spark.sql.hudi.common,org.apache.spark.sql.hudi.ddl,org.apache.spark.sql.hudi.procedure,org.apache.spark.sql.hudi.feature
  SCALA_TEST_OTHERS1_FILTER: -DwildcardSuites=org.apache.spark.sql.hudi.procedure,org.apache.spark.sql.hudi.ddl
  SCALA_TEST_OTHERS2_FILTER: -DwildcardSuites=org.apache.hudi,org.apache.spark.hudi,org.apache.spark.sql.avro,org.apache.spark.sql.execution,org.apache.spark.sql.hive,org.apache.spark.sql.hudi.analysis,org.apache.spark.sql.hudi.blob,org.apache.spark.sql.hudi.catalog,org.apache.spark.sql.hudi.command,org.apache.spark.sql.hudi.common,org.apache.spark.sql.hudi.feature

jobs:
  # hudi-cli rides along with hudi-spark-client here rather than joining the catch-all
  # module lists in test-common-and-other-modules: its functional suite starts a
  # SparkSession per test class, and this job has the headroom for it while that one does
  # not. hudi-cli's dependency closure is a superset of hudi-spark-client's, so it shares
  # this job's build instead of paying for a second one. It stays listed in the catch-all
  # job's UT_MODULES/FT_MODULES exclusions so the tests are not run twice.
  test-spark-client-and-hadoop-common:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      matrix:
        include:
          - scalaProfile: "scala-2.12"
            sparkProfile: "spark3.5"
            flinkProfile: "flink2.2"

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          architecture: x64
          cache: maven
      - name: Build Project
        env:
          SCALA_PROFILE: ${{ matrix.scalaProfile }}
          SPARK_PROFILE: ${{ matrix.sparkProfile }}
          FLINK_PROFILE: ${{ matrix.flinkProfile }}
        run:
          mvn clean install -T 2 -D"$SCALA_PROFILE" -D"$SPARK_PROFILE" -D"$FLINK_PROFILE" -DskipTests=true -Phudi-platform-service $MVN_ARGS -am -pl hudi-client/hudi-spark-client,hudi-cli
      - name: UT - hudi-hadoop-common
        env:
          SCALA_PROFILE: ${{ matrix.scalaProfile }}
          SPARK_PROFILE: ${{ matrix.sparkProfile }}
          FLINK_PROFILE: ${{ matrix.flinkProfile }}
        run:
          mvn test -Punit-tests -D"$SCALA_PROFILE" -D"$SPARK_PROFILE" -D"$FLINK_PROFILE" -fae -pl hudi-hadoop-common $MVN_ARGS -Djacoco.skip=false
      - name: UT - hudi-client/hudi-spark-client
        env:
          SCALA_PROFILE: ${{ matrix.scalaProfile }}
          SPARK_PROFILE: ${{ matrix.sparkProfile }}
          FLINK_PROFILE: ${{ matrix.flinkProfile }}
        run:
          mvn test -Punit-tests -D"$SCALA_PROFILE" -D"$SPARK_PROFILE" -D"$FLINK_PROFILE" -fae -pl hudi-client/hudi-spark-client $MVN_ARGS -Djacoco.skip=false
      - name: FT - hudi-client/hudi-spark-client
        env:
          SCALA_PROFILE: ${{ matrix.scalaProfile }}
          SPARK_PROFILE: ${{ matrix.sparkProfile }}
          FLINK_PROFILE: ${{ matrix.flinkProfile }}
        run:
          mvn test -Pfunctional-tests -D"$SCALA_PROFILE" -D"$SPARK_PROFILE" -D"$FLINK_PROFILE" -fae -pl hudi-client/hudi-spark-client $MVN_ARGS -Djacoco.skip=false
      - name: UT - hudi-cli
        env:
          SCALA_PROFILE: ${{ matrix.scalaProfile }}
          SPARK_PROFILE: ${{ matrix.sparkProfile }}
          FLINK_PROFILE: ${{ matrix.flinkProfile }}
        run:
          mvn test -Punit-tests -D"$SCALA_PROFILE" -D"$SPARK_PROFILE" -D"$FLINK_PROFILE" -fae -pl hudi-cli $MVN_ARGS -Djacoco.skip=false
      - name: FT - hudi-cli
        env:
          SCALA_PROFILE: ${{ matrix.scalaProfile }}
          SPARK_PROFILE: ${{ matrix.sparkProfile }}
          FLINK_PROFILE: ${{ matrix.flinkProfile }}
        run:
          mvn test -Pfunctional-tests -D"$SCALA_PROFILE" -D"$SPARK_PROFILE" -D"$FLINK_PROFILE" -fae -pl hudi-cli $MVN_ARGS -Djacoco.skip=false
      - name: Test timing summary
        if: always()
        run: python3 scripts/ci/test_timing_summary.py --title "${{ github.job }}"
      - name: Generate merged coverage report
        if: always()
        run: ./scripts/jacoco/generate_merged_coverage_report.sh $GITHUB_WORKSPACE
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          files: ./jacoco-report.xml
          disable_search: true
          flags: spark-client-hadoop-common
          token: ${{ secrets.CODECOV_TOKEN }}

  test-utilities-streamer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - scalaProfile: "scala-2.12"
            sparkProfile: "spark3.5"
            flinkProfile: "flink2.2"

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          architecture: x64
          cache: maven
      - name: Build Project
        env:
          SCALA_PROFILE: ${{ matrix.scalaProfile }}
          SPARK_PROFILE: ${{ matrix.sparkProfile }}
          FLINK_PROFILE: ${{ matrix.flinkProfile }}
        run:
          mvn clean install -T 2 -D"$SCALA_PROFILE" -D"$SPARK_PROFILE" -D"$FLINK_PROFILE" -DskipTests=true -Phudi-platform-service -Pthrift-gen-source $MVN_ARGS -am -pl hudi-utilities
      - name: UT - hudi-utilities (TestHoodieDeltaStreamer*)
        env:
          SCALA_PROFILE: ${{ matrix.scalaProfile }}
          SPARK_PROFILE: ${{ matrix.sparkProfile }}
          FLINK_PROFILE: ${{ matrix.flinkProfile }}
        run:
          mvn test -Punit-tests -D"$SCALA_PROFILE" -D"$SPARK_PROFILE" -D"$FLINK_PROFILE" -fae -Dtest="TestHoodieDeltaStreamer*" -Dsurefire.failIfNoSpecifiedTests=false -pl hudi-utilities $MVN_ARGS -Djacoco.skip=false
      - name: Test timing summary
        if: always()
        run: python3 scripts/ci/test_timing_summary.py --title "${{ github.job }}"
      - name: Generate merged coverage report
        if: always()
        run: ./scripts/jacoco/generate_merged_coverage_report.sh $GITHUB_WORKSPACE
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          files: ./jacoco-report.xml
          disable_search: true
          flags: utilities
          token: ${{ secrets.CODECOV_TOKEN }}

  test-utilities-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - scalaProfile: "scala-2.12"
            sparkProfile: "spark3.5"
            flinkProfile: "flink2.2"

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          architecture: x64
          cache: maven
      - name: Build Project
        env:
          SCALA_PROFILE: ${{ matrix.scalaProfile }}
          SPARK_PROFILE: ${{ matrix.sparkProfile }}
          FLINK_PROFILE: ${{ matrix.flinkProfile }}
        run:
          mvn clean install -T 2 -D"$SCALA_PROFILE" -D"$SPARK_PROFILE" -D"$FLINK_PROFILE" -DskipTests=true -Phudi-platform-service -Pthrift-gen-source $MVN_ARGS -am -pl hudi-utilities
      - name: UT - hudi-utilities (non-TestHoodieDeltaStreamer)
        env:
          SCALA_PROFILE: ${{ matrix.scalaProfile }}
          SPARK_PROFILE: ${{ matrix.sparkProfile }}
          FLINK_PROFILE: ${{ matrix.flinkProfile }}
        run:
          mvn test -Punit-tests -D"$SCALA_PROFILE" -D"$SPARK_PROFILE" -D"$FLINK_PROFILE" -fae -Dtest='!TestHoodieDeltaStreamer*' -Dsurefire.failIfNoSpecifiedTests=false -pl hudi-utilities $MVN_ARGS -Djacoco.skip=false
      - name: FT - hudi-utilities
        env:
          SCALA_PROFILE: ${{ matrix.scalaProfile }}
          SPARK_PROFILE: ${{ matrix.sparkProfile }}
          FLINK_PROFILE: ${{ matrix.flinkProfile }}
        run:
          mvn test -Pfunctional-tests -D"$SCALA_PROFILE" -D"$SPARK_PROFILE" -D"$FLINK_PROFILE" -fae -Dsurefire.failIfNoSpecifiedTests=false -pl hudi-utilities $MVN_ARGS -Djacoco.skip=false
      - name: Test timing summary
        if: always()
        run: python3 scripts/ci/test_timing_summary.py --title "${{ github.job }}"
      - name: Generate merged coverage report
        if: always()
        run: ./scripts/jacoco/generate_merged_coverage_report.sh $GITHUB_WORKSPACE
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          files: ./jacoco-report.xml
          disable_search: true
          flags: utilities
          token: ${{ secrets.CODECOV_TOKEN }}

  test-common-and-other-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - scalaProfile: "scala-2.12"
            sparkProfile: "spark3.5"
            flinkProfile: "flink2.2"

    env:
      UT_MODULES: >-
        !hudi-hadoop-common,!hudi-hadoop-mr,!hudi-client/hudi-java-client,!hudi-client/hudi-spark-client,!hudi-cli,!hudi-examples,!hudi-examples/hudi-examples-common,!hudi-examples/hudi-examples-flink,!hudi-examples/hudi-examples-java,!hudi-examples/hudi-examples-k8s,!hudi-examples/hudi-examples-spark,!hudi-spark-datasource,!hudi-spark-datasource/hudi-spark,!hudi-spark-datasource/hudi-spark3.5.x,!hudi-spark-datasource/hudi-spark3-common,!hudi-spark-datasource/hudi-spark-common,!hudi-utilities
      FT_MODULES: >-
        !hudi-client/hudi-spark-client,!hudi-cli,!hudi-examples,!hudi-examples/hudi-examples-common,!hudi-examples/hudi-examples-flink,!hudi-examples/hudi-examples-java,!hudi-examples/hudi-examples-k8s,!hudi-examples/hudi-examples-spark,!hudi-spark-datasource/hudi-spark,!hudi-utilities
      # The fourteen bundles of the default reactor. None has tests, validate-bundles shades and
      # exercises every one, and nothing this job tests depends on them, so the build and the two
      # test steps below all leave them out (a bundle left in a test reactor would try to resolve
      # the modules the trimmed build no longer installs).
      BUNDLE_MODULES: >-
        !packaging/hudi-hadoop-mr-bundle,!packaging/hudi-datahub-sync-bundle,!packaging/hudi-hive-sync-bundle,!packaging/hudi-aws-bundle,!packaging/hudi-gcp-bundle,!packaging/hudi-azure-bundle,!packaging/hudi-spark-bundle,!packaging/hudi-presto-bundle,!packaging/hudi-utilities-slim-bundle,!packaging/hudi-timeline-server-bundle,!packaging/hudi-flink-bundle,!packaging/hudi-kafka-connect-bundle,!packaging/hudi-cli-bundle,!packaging/hudi-utilities-bundle
      # Also skipped by the build: the metaserver bundle, which only exists under
      # -Phudi-platform-service and so cannot be listed for the test steps; the examples, which
      # this job never tests; and hudi-cli, which depends on the utilities bundle and is built
      # and tested in test-spark-client-and-hadoop-common.
      BUILD_SKIP_MODULES: >-
        !packaging/hudi-metaserver-server-bundle,!hudi-cli,!hudi-examples/hudi-examples-common,!hudi-examples/hudi-examples-spark,!hudi-examples/hudi-examples-flink,!hudi-examples/hudi-examples-java,!hudi-examples/hudi-examples-k8s

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          architecture: x64
          cache: maven
      - name: Build Docker image
        run: docker build -t hudi-ci .
      - name: Build Project
        env:
          SCALA_PROFILE: ${{ matrix.scalaProfile }}
          SPARK_PROFILE: ${{ matrix.sparkProfile }}
          FLINK_PROFILE: ${{ matrix.flinkProfile }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/hudi" \
            -v "$HOME/.m2:/root/.m2" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -w /hudi \
            hudi-ci \
            /bin/bash -c "MAVEN_OPTS='-Xmx8g' mvn clean install -T 2 -D$SCALA_PROFILE -D$SPARK_PROFILE -D$FLINK_PROFILE -Phudi-platform-service -Pthrift-gen-source -DskipTests=true -Dmaven.compiler.maxmem=8192m -Dcheckstyle.skip=true -Drat.skip=true $MVN_ARGS -pl $BUILD_SKIP_MODULES,$BUNDLE_MODULES"
      - name: UT - common and other modules
        env:
          SCALA_PROFILE: ${{ matrix.scalaProfile }}
          SPARK_PROFILE: ${{ matrix.sparkProfile }}
          FLINK_PROFILE: ${{ matrix.flinkProfile }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/hudi" \
            -v "$HOME/.m2:/root/.m2" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -w /hudi \
            hudi-ci \
            /bin/bash -c "MAVEN_OPTS='-Xmx4g' mvn test -Punit-tests -D$SCALA_PROFILE -D$SPARK_PROFILE -D$FLINK_PROFILE -fae -pl $UT_MODULES,$BUNDLE_MODULES -Dcheckstyle.skip=true -Drat.skip=true $MVN_ARGS -Djacoco.skip=false"
      - name: FT - common and other modules
        env:
          SCALA_PROFILE: ${{ matrix.scalaProfile }}
          SPARK_PROFILE: ${{ matrix.sparkProfile }}
          FLINK_PROFILE: ${{ matrix.flinkProfile }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/hudi" \
            -v "$HOME/.m2:/root/.m2" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -w /hudi \
            hudi-ci \
            /bin/bash -c "MAVEN_OPTS='-Xmx4g' mvn test -Pfunctional-tests -D$SCALA_PROFILE -D$SPARK_PROFILE -D$FLINK_PROFILE -fae -pl $FT_MODULES,$BUNDLE_MODULES -Dcheckstyle.skip=true -Drat.skip=true $MVN_ARGS -Djacoco.skip=false"
      - name: Test timing summary
        if: always()
        run: python3 scripts/ci/test_timing_summary.py --title "${{ github.job }}"
      - name: Generate merged coverage report
        if: always()
        run: ./scripts/jacoco/generate_merged_coverage_report.sh $GITHUB_WORKSPACE
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          files: ./jacoco-report.xml
          disable_search: true
          flags: common-and-other-modules
          token: ${{ secrets.CODECOV_TOKEN }}

