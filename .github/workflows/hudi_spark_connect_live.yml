name: Hudi Spark Connect live acceptance

# Explicit opt-in: this creates a disposable kind cluster and runs real Spark SQL.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KUBECONFIG: ${{ runner.temp }}/hudi-connect-kubeconfig
    steps:
      - uses: actions/checkout@v5
      - name: Check runner tools
        run: |
          set -euo pipefail
          command -v docker
          command -v kind
          command -v kubectl
          command -v helm
          command -v python3
      - name: Create isolated cluster and build image
        run: |
          set -euo pipefail
          kind create cluster --name hudi-connect-ci --kubeconfig "$KUBECONFIG" \
            --image kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0 --wait 120s
          ./hudi-lakehouse/scripts/build-connect-image.sh
          kind load docker-image hudi-lakehouse-spark-connect:4.1.3-hudi1.2.0 --name hudi-connect-ci
      - name: Deploy local lakehouse
        run: ./hudi-lakehouse/local-dev/scripts/up.sh --spark-connect
      - name: Install ADBC client
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/connect-venv"
          "$RUNNER_TEMP/connect-venv/bin/pip" install -r hudi-lakehouse/local-dev/example/connect-requirements.txt dbc==0.3.1
          "$RUNNER_TEMP/connect-venv/bin/dbc" install 'spark=0.2.1'
      - name: Verify SQL and persistence after restart
        env:
          PYTHON: ${{ runner.temp }}/connect-venv/bin/python
        run: ./hudi-lakehouse/local-dev/scripts/test-spark-connect.sh --restart-endpoint --sql-matrix
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n hudi-lakehouse get pods -o wide || true
          kubectl -n hudi-lakehouse describe pods || true
          kubectl -n hudi-lakehouse logs deploy/hudi-spark-connect --tail=200 || true
      - name: Delete isolated cluster
        if: always()
        run: kind delete cluster --name hudi-connect-ci --kubeconfig "$KUBECONFIG"
