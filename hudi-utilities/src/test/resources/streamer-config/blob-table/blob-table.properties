# One stock HoodieStreamer, UnstructuredDataSource (mode blob, cloud s3) and BlobQuarantineTransformer, UPSERT with commit-time ordering.
# The record key is one version of one object: the source path sha with the version tag the status call observed.
# Partitioning is the job's choice; this job partitions by the source file extension.
hoodie.unstructured.source.mode=blob
hoodie.unstructured.source.cloud=s3
hoodie.datasource.write.recordkey.field=source_path_sha,source_modification_time,source_file_size
hoodie.datasource.write.partitionpath.field=source_file_extension
hoodie.datasource.write.keygenerator.class=org.apache.hudi.keygen.ComplexKeyGenerator
hoodie.datasource.write.hive_style_partitioning=false
hoodie.blob.table.inline.max.bytes=1048576
hoodie.blob.table.file.extensions=pdf,png,jpg,jpeg,gif,bmp,tif,tiff,mp4,mov,avi,mkv,webm
# the blob table's writer settings: the blob column's Parquet setup (required by UnstructuredDataSource in mode blob), stored-as-is bytes
# and no record-key bloom filter; the streamer sets each one the job leaves out
hoodie.parquet.write.config.injector.class=org.apache.hudi.utilities.sources.blob.BlobParquetConfigInjector
hoodie.parquet.compression.codec=uncompressed
hoodie.parquet.bloom.filter.enabled=false
hoodie.upsert.shuffle.parallelism=2
hoodie.insert.shuffle.parallelism=2
hoodie.delete.shuffle.parallelism=2
hoodie.metadata.enable=false
hoodie.clean.automatic=false
